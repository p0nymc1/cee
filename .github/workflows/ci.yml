name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Lets a run be started by hand from the Actions tab or `gh workflow run`,
  # which the push/PR triggers alone do not allow.
  workflow_dispatch:
  # Keeps the crypto surveillance sweep current: it screens live quotes, so a
  # page rebuilt only on pushes would show whatever the market was doing
  # whenever someone last committed. Offset from the hour because scheduled
  # runs bunch up and get delayed at :00.
  schedule:
    - cron: "17 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the exact toolchain from go.mod so CI never drifts from the
          # version the module declares.
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Lint the plugin catalog
        # The same gate contributors run locally: every listed plugin must
        # pass manifest validation before it can ship.
        run: go run ./cmd/cee lint

      - name: Build & test satellite modules
        # Satellites are separate modules (their own go.mod, own dependencies)
        # so the core job above never touches them. Gate them here.
        run: |
          for mod in satellites/*/; do
            echo "== $mod =="
            ( cd "$mod" && go build ./... && go vet ./... && go test ./... )
          done

  # The job above proves the code compiles and its tests pass. This one runs
  # the product: every example end to end, every shipped manifest through the
  # validator, and the benchmark leaderboard. A green tick here means the
  # thing demonstrably works, not merely that it builds -- and the run log is
  # the artifact you read to see what it actually did.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # This module has no external dependencies, so there is no go.sum to
          # key a dependency cache on. Leaving the cache enabled makes every
          # run emit a "Restore cache failed" annotation for a file that is
          # deliberately absent (handbook rule 1.5).
          cache: false

      - name: Run everything, capturing output
        run: |
          mkdir -p demo-output
          for ex in rule_change crypto_surveillance network_detection security_monitoring human_approval meta_scenarios; do
            go run "./examples/$ex" | tee "demo-output/$ex.txt"
          done
          for m in examples/manifests/*.json catalog/plugins/*/manifest.json; do
            printf '%-46s ' "$m" >> demo-output/validate.txt
            go run ./cmd/cee validate "$m" >> demo-output/validate.txt
          done
          go run ./cmd/cee list  | tee demo-output/list.txt
          go run ./cmd/cee bench | tee demo-output/bench.txt
          go test ./... 2>&1 | grep -c '^ok' > demo-output/packages.txt
          grep -rh '^func Test' --include='*_test.go' . | wc -l | tr -d ' ' > demo-output/tests.txt

      # Renders a report on the run's own page. A README can claim what the
      # engine does; this shows what it did, on a clean machine, at this
      # commit -- and it cannot drift, because nothing here is hand-written.
      - name: Publish the run report
        if: always()
        run: |
          {
            echo "# CEE — what actually ran"
            echo
            echo "Executed on a clean GitHub runner at commit \`${GITHUB_SHA:0:7}\`."
            echo "Every block below is captured output, not documentation."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Packages passing | $(cat demo-output/packages.txt) |"
            echo "| Tests | $(cat demo-output/tests.txt) |"
            echo "| External dependencies | 0 |"
            echo
            echo "## Crypto market surveillance — live data"
            echo
            echo "Fixed thresholds over live quotes, re-run hourly. Anomaly flagging, not"
            echo "investment advice. A finding is only raised when the data behind it is worth"
            echo "acting on: a probe holds anything computed from a stale quote or a book too"
            echo "thin for a percentage move to mean anything."
            echo '```'
            cat demo-output/crypto_surveillance.txt
            echo '```'
            echo
            echo "## Network intrusion detection"
            echo
            echo "Alerts are matched to MITRE ATT&CK techniques and contained automatically --"
            echo "unless containment would do more damage than the intrusion. A pre-execution"
            echo "probe assesses the blast radius first, so blocking an address that turns out"
            echo "to be our own VPN egress, or isolating the jump host the responders log in"
            echo "through, routes to an analyst instead of executing."
            echo '```'
            cat demo-output/network_detection.txt
            echo '```'
            echo
            echo "## Security monitoring — an L2 plugin"
            echo
            echo "An intent matches a brute-force technique, then a sandbox probe runs *before*"
            echo "the containment action. On an ordinary host the action proceeds. On a domain"
            echo "controller the probe refuses, and the breaker downgrades to human approval"
            echo "rather than isolating a critical asset."
            echo '```'
            cat demo-output/security_monitoring.txt
            echo '```'
            echo
            echo "## Expense approval — an L1 plugin, zero Go"
            echo
            echo "The whole DAG is a JSON manifest. Over the threshold the run suspends for a"
            echo "manager and a resume pointer is issued; the decision arrives later and the run"
            echo "continues from where it stopped. Note the trace spans the pause."
            echo '```'
            cat demo-output/human_approval.txt
            echo '```'
            echo
            echo "## Three more scenarios"
            echo
            echo "An N-way switch built from steps with only two outbound edges; scheduling on an"
            echo "engine that has no clock; and a batch, where the loop lives in the caller"
            echo "because the DAG rejects cycles."
            echo '```'
            cat demo-output/meta_scenarios.txt
            echo '```'
            echo
            echo "## Plugin catalog"
            echo
            echo '```'
            cat demo-output/list.txt
            echo '```'
            echo
            echo "Ranked by how many LLM calls each plugin removes against a baseline agent that"
            echo "would call a model once per step:"
            echo
            echo '```'
            cat demo-output/bench.txt
            echo '```'
            echo
            echo "## Manifest validation"
            echo
            echo "<details><summary>Every shipped manifest, statically checked</summary>"
            echo
            echo '```'
            cat demo-output/validate.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the captured output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: demo-output/
          # Default is warn, which lets an upload that matched nothing report
          # success -- exactly how a dot-prefixed path silently uploaded zero
          # files while the step went green.
          if-no-files-found: error

  # The job summary is per-run, so its URL changes every time and cannot be
  # handed to anyone. This publishes the same captured output to one fixed
  # address, rebuilt on every push to main -- a page you can send someone that
  # is never out of date with the code, because nothing on it is written by
  # hand.
  pages:
    needs: demo
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch what the demo job actually ran
        uses: actions/download-artifact@v4
        with:
          name: demo-output
          path: demo-output

      - name: Build the page
        run: bash .github/build-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
